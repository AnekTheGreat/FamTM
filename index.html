<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a26;--mute:#6b7a74;--acc:#1f6f5c;--onacc:#fff;--line:#e3dfd5;--danger:#b3412f}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1b2622;--ink:#e8efe9;--mute:#93a39b;--acc:#4cc3a4;--onacc:#08231c;--line:#2a3833;--danger:#ff8a75}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#top{position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:2;padding:12px 16px 8px}
#top div{display:flex;align-items:center;gap:8px;margin-bottom:8px}h1{font-size:21px;margin:0;flex:1}h2{margin:0 0 4px}h3{margin:16px 0 6px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.m,small{color:var(--mute)}.m{margin:4px 0}.ib{background:none;border:0;color:var(--ink);font-size:26px;padding:0 8px}#rf{font-size:22px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}label input,label textarea{margin-top:4px;font-size:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
main{padding:4px 16px calc(150px + env(safe-area-inset-bottom))}
.card{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:3}
nav button{flex:1;padding:14px;background:none;border:0;color:var(--mute);font:600 15px system-ui}nav .on{color:var(--acc)}
#fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:32px;box-shadow:0 4px 14px #0004;z-index:3}
dialog{border:0;border-radius:18px;padding:18px;width:min(560px,94vw);max-height:88vh;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#0008}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui}.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.btn.d{color:var(--danger)}
.bar{display:flex;gap:8px;justify-content:space-between;margin-top:18px}.bar span{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;margin:0 6px 6px 0;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:14px system-ui}.x{background:none;border:0;color:var(--danger);font-size:18px;padding:0}
.er{color:var(--danger);margin:8px 0 0}.empty{text-align:center;padding:60px 10px}.menu .btn{display:block;width:100%;margin-top:8px;text-align:left}
details,.leaf{margin:4px 0 4px 12px;padding-left:10px;border-left:2px solid var(--line)}summary{padding:6px 0;cursor:pointer}.leaf{padding:6px 0 6px 10px}.n{font-weight:600;color:var(--acc)}main>details,main>.leaf{margin-left:0}
#tt{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#tt.on{opacity:1}
.note{padding:12px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px}.note div:first-child{white-space:pre-wrap}.cbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}.sel{background:var(--acc);color:var(--onacc);border-radius:6px;padding:1px 6px}textarea{resize:vertical}p{white-space:pre-wrap}
.grow{flex:1;min-width:0}.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--line)}.av.lg{width:104px;height:104px;margin:0 0 6px;display:block}.eb{background:none;border:0;color:var(--mute);font-size:20px;padding:6px 4px;flex:0 0 auto}.phr{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}.phr .av{width:64px;height:64px}
.nk{color:var(--mute);font-style:italic}.treescroll{position:relative;height:70vh;min-height:260px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}.treeinner{position:relative;transform-origin:0 0;will-change:transform}.tedge{position:absolute;left:0;top:0;pointer-events:none}.tedge path{fill:none;stroke:var(--line);stroke-width:2}.tnode{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:12px system-ui;box-shadow:0 1px 3px #0001;box-sizing:border-box;overflow:hidden}.tnode.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.tline{display:flex;flex-direction:row;align-items:flex-start;gap:10px;flex:1 1 auto;min-width:0}.tnode .av{width:34px;height:34px}.tex{background:none;border:1px solid var(--line);border-radius:8px;color:var(--acc);font:600 11px system-ui;padding:2px 6px;margin-left:auto;flex:0 0 auto}.trow{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0;overflow:hidden;overflow-wrap:break-word}.trow.more{color:var(--mute)}
.tnode.multi{padding:2px 10px;border-color:transparent;background:transparent}.tnode.multi .tline{align-self:stretch;align-items:stretch}.tnode.multi .trow{position:relative;z-index:1;display:flex;align-items:center;outline:1px solid var(--line);outline-offset:-1px;border-radius:8px;background:var(--card)}.cw{flex:1 1 auto;min-width:0}.mar{position:absolute;top:50%;margin-top:-1px;width:10px;height:2px;background:var(--line);pointer-events:none;z-index:0}.treeinner.zo .tnode{font:13px system-ui}.treeinner.zo .tnode small{display:none}.orow{display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line)}.orow:last-child{border-bottom:0}.orow .tex{margin-left:0;min-width:26px}.tl{width:26px;flex:0 0 auto;display:inline-block}.tscroll{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 10px;overflow:auto}
</style></head><body>

<script id="upd" type="application/json">[{"v":"1.0.1","d":"2026-10-13","t":"Two marriages side by side, a settings icon, and What’s New","x":["Two marriages, side by side: someone married to two people is now drawn with one husband or wife on the left and the other on the right, and that person in the middle — nobody is drawn twice and neither marriage is lost.","Married people are joined by a line: the line between two cards is drawn only for the two people it really belongs to, and it runs behind anyone sitting in between, so a marriage can be read at a glance and two people who are not married are never joined by it.","The ⋮ menu is now a settings icon: the same page, opened with a gear in the top bar, which also shows the version of the app.","What’s New after an update: the first time a new version runs, a popup lists what changed in it. It appears once per version — on the first launch after the update — and not again on every launch.","What’s New archive in Settings: every update this app has ever had, newest first, not only the latest.","This update is v1.0.1."]},{"d":"2026-10-12","t":"The parents a family already states are linked by themselves","x":["You no longer link every parent by hand. Two rules, both of them things the page already did elsewhere, are now applied to the whole tree — when it opens and before every save:","The other half of a couple. A child of one half of a couple is a child of the other half. That is what + Child from someone's own page already wrote down; picking a child who is already in the tree, or linking a brother or sister to somebody who has a parent, used to record one parent only — so t…","A brother or sister with nobody recorded takes the parents their brother or sister has, the mother and father alike, and through a chain (a brother of my brother is my brother too) — which is what the sibling link already meant when the parent was filled in first.","It only ever fills in, and only where the family is sure. A parent is added only where there is room for one (two parents, no self, no duplicate, no loop back on the family), where nothing else is contradicted, and where the family can still be drawn. Nobody is invented, nothing is ever taken awa…","Where the family speaks with two voices it is left alone. A person with two partners (a second marriage) is not guessed at — which of them a child belongs to is not something the page can tell. A brother or sister who has a parent the others do not have is left as they are: that is a second famil…","Menu (⋮) → Stop linking parents automatically turns the whole thing off; Link parents automatically turns it back on, filling the family in there and then. With it off the page links only what you link by hand, and a parent you take off by hand stays off.","The page says what it linked by itself — Linked N parents automatically — when it opens on a tree that was entered by hand, and the result is saved, so it happens once and not on every launch.","The stored format is exactly the same: a filled-in parent is an ordinary parent link, so a backup made here restores into any earlier version and an older backup restores into this one. The page writes to storage only when there was something to fill in.","What it cannot know: a step-parent cannot be told from a parent, so the other half of a couple is taken as a parent like any other. That is what the switch in the menu is for, and any single parent can still be taken off on the person's own page → Edit."]},{"d":"2026-10-12","t":"A brother or sister without a parent is no longer a stranger called \"Unknown\"","x":["Brothers and sisters with no parent recorded are drawn beside each other. Two people linked this way used to be laid out as two separate families, one on the page below the other — the sibling goes further down with their family. They are now one block: the two sit on the same row, side by side, …","When only one of them has a parent written down, that parent stays above their own child and the two are still drawn on one row — nobody is left a row below their brother or sister.","Families with no such link are laid out exactly as before: the block only merges boxes that really hold brothers or sisters.","Linking two people as brother and sister when neither of them has a parent recorded invented a person called \"Unknown\" and made it the parent of both. That stranger then sat in the tree as a box of its own, and — worse — a husband and wife could be linked as brother and sister this way, which qui…","The two are now written down as each other's brother or sister, which is all the family really knows. They appear under Siblings on both their pages, and everyone the family reads off a brother or sister still works from that link (a child of theirs is a niece or nephew, their parent's other chil…","A brother of my brother is my brother too: three people joined two at a time are all brothers and sisters of one another, exactly as they would be if a parent of theirs had been filled in. Only the pairs that were new are stored.","A husband and wife can no longer be linked as brother and sister — it is refused (Already partners) and nothing is written, in the picker and on the tree's Connect people alike.","The ways that already worked are untouched. If one of the two has a parent recorded, that parent is still shared with the other (the long-standing \"a sibling a married-in person can take\" behaviour), and two people who already share a real parent are left exactly as they are — nothing extra is st…","Remove N Unknown parents in the menu (⋮), which appears only when the tree actually holds one of these invented parents — someone called Unknown with no dates, no photo, no note, no parents, no partner and two or more children. It asks first, then takes the invented parent away and leaves the peo…","The stored format only grew a field, and only for a pair with no parent (sibs, written on both people). A person with no such link is stored byte for byte as before, so a backup from any earlier version restores into this one and this one's backups restore into it. A backup made here and restored…"]},{"d":"2026-10-12","t":"A birthday reminder for everyone who is alive","x":["Birthdays in the menu (⋮): everyone alive whose born date has a day and month, soonest first, with how far off it is — today, tomorrow, in 12 days — and the age they turn when a year was given. Tapping a name opens that person.","Remind me on the day in that page. Turned on, the phone puts one quiet notification on the screen in the morning of each living person's birthday — “🎂 Neelu Chopra’s birthday · Turning 46 today” — whether the app is open or not.","Only the day and month of each living person is handed to the phone, so the date comes round on its own every year and nothing has to be sent again. The names never leave the phone.","Someone with a Died date is never included. A born date with only a year (or none) has no day to keep, so it is skipped, and the page says how to give one.","Android 13 and later asks for notification permission at the moment reminders are turned on; nothing is asked for at install time. The daily check runs shortly after 9am (the exact minute is the phone's own choice), and the phone may hold it back a while on a battery-saving day.","An app older than this page says Update the app first (⟳ in the top bar) instead of offering a toggle that could not work.","The list the phone holds is refreshed whenever the family changes — adding, editing, deleting, or restoring a backup — so a birthday added today is reminded from the next morning on."]},{"d":"2026-10-12","t":"Cousins, aunts and uncles, nieces and nephews, and no example dates in the form","x":["The rest of the family. A person's own page now offers, beside + Parent / + Partner / + Child / + Brother / Sister:","+ Aunt / Uncle — a brother or sister of one of their parents. With two parents it asks which side.","+ Niece / Nephew — a child of one of their brothers or sisters.","+ Cousin — a child of one of their aunts or uncles.","+ Grandparent — a parent of one of their parents.","+ Grandchild — a child of one of their children.","Link someone already added gained Pick an aunt / uncle, Pick a niece / nephew and Pick a cousin for people who are already in the tree. A brother or sister is never offered as an aunt, a niece or a cousin.","Connect people on the tree now also offers \"is an aunt or uncle of\", \"is a niece or nephew of\" and \"They are cousins\".","When more than one relative could hold the new person, the app asks which one (e.g. Whose brother or sister?) instead of guessing; when the family has nobody for them to hang off yet it says what to add first (e.g. Add Neelu's father or mother first – a cousin is their child) rather than inventin…","No example dates in the form. Born no longer shows 7/4, 4 Jul 1950 (year optional) and Died no longer shows 7/4 or 4 Jul 1950 – blank if living (which was being cut off mid-word in the half-width box); Nickname's hint is just optional. Dates read exactly as before, year or no year, and a date it …","A message about something done inside a dialog is now shown over the dialog instead of behind it, so a refusal is actually readable.","Tapping a person, a name or a ▾ in the tree with a mouse now works: while the panel is watching for a drag the browser can send it the click itself, and the panel hands that click to whoever is really under the pointer.","The stored format. Every new relative is written as the ordinary parent links the family already uses, so a backup from any earlier version restores into this one and this one's backups restore into it."]},{"d":"2026-10-11","t":"Take a photo with the camera, and change a picture from the person's own page","x":["Take photo. The Photo section of the Add/Edit form and a person's own page both offer Take photo, which opens the phone's camera and puts the picture straight into the person — shrunk to the same small picture as every other photo. No camera permission and no storage permission is asked for: the …","Change photo from the person's own page. Their page now has Add photo / Change photo and Take photo right under their dates, so a picture can be changed without going into Edit first. The new picture is saved and shown the moment it arrives.","The taken picture is kept only as long as it takes the page to read it: only the newest one is kept and the folder is emptied on every launch, so the app does not slowly fill the phone.","Version 1.1 (versionCode 2). Install the new APK from Actions to get the camera; until then the page updated over the air simply hides the Take photo buttons rather than offering a camera it cannot open, and everything else keeps working. In a plain phone browser the same button uses the browser'…","The picture is an ordinary photo like the ones you already have: pick a new one and the old one is replaced, or use Remove to drop it."]},{"d":"2026-10-11","t":"A date with no year is fine, and it is written out in full","x":["The Born and Died boxes take a date however it is written, and the year can be left out. \"7/4\" is the 4th of July and is accepted on its own — so are \"4 Jul\", \"4th July\", \"July 4\", \"July 1950\", \"7/4/1950\", \"4 Jul 1950\", \"7-4-1950\", \"7/1950\", \"1950-07\", \"1950\", and a month by itself for \"some time…","A date is written out in full wherever it is shown — the person's page (\"Born 4 Jul\"), the people list, the cards on the map and the exported PDF: a day and a month when no year was given, \"Jul 1950\" when only the month and the year are known, and the year whenever there is one. The stored code i…","Opening a person for editing shows the date written out (\"4 Jul\"), and saving it again keeps the date exactly as it was — a date with no year stays a date with no year.","Notes read the same dates. \"Mary Smith b. 7/4\", \"born July 4 1950\" and \"b. 21/7\" now give the person a real date, and a month written out is no longer swallowed into the name — \"born July 4 1950\" used to make the name \"Mary Smith born July 4\".","A date with no year is kept as itself (--07-04, the standard way to write a date without a year), so no year is ever invented for it: ages, the year range on a card and the A–Z ordering all treat it as \"year unknown\".","On the build on your phone her father's box is centred over the couple — measured on your shape at phone zoom he sits 11.5 canvas px from the middle of the pair and only 21 px from the husband's card, which is why he reads as the husband's parents. This file lines him up on her own card (9.4 px o…","Where the husband's own parents' box is in the same row and the row has no slack, her father's box leans as close as the row allows instead of being drawn over the family beside it — his line still ends on her own card."]},{"d":"2026-10-11","t":"If all you know is a nickname, that is enough","x":["A person can now be saved with only a nickname. The Add/Edit form insisted on a Name and refused the save with \"Name is required.\", so someone you only know by a nickname could not be added at all. Either box is now enough: type the nickname, save, and the person is added and shown under it. The …","When a nickname is all there is, it becomes the person's name. Nothing is left with an empty name and the nickname trailing behind it as a quoted afterthought (a card reading just “Bobby”). If you do know the full name, both are kept exactly as before and the card reads Robert Singh “Bobby”.","People made from a note work the same way. A note like “Bobby” b. 1950 — via Make person or Make people from all — used to produce somebody with no name at all, drawn as a blank card with “Bobby” beside it. They now come out named Bobby. Records already saved that way, and backups restored from t…"]},{"d":"2026-10-11","t":"The girl's parents are drawn over the girl","x":["A couple's in-law parents now sit over their own child inside the box, not over the middle of the pair. When a mother and father have just the one child in a couple box — a daughter who married into the family above her — their box was drawn centred on the pair, so the family over the couple read…","Nothing else moved: the couple still stays with the family it is read through, the family next door is never shifted to make room, and no box ever overlaps another. If the room on the row is not there, the box leans as close as it can and the page grows instead — it is never drawn over its neighb…","The map still opens at the readable zoom (names around 9–10px on a phone), not fitted to the whole family. Fit shows everyone when you want the overview."]},{"d":"2026-10-11","t":"Folding a branch keeps your place, and Fit really shows everyone","x":["Folding a branch no longer leaves you somewhere else on the page. Folding a box can cut a family loose — the married couple that joined two sides is drawn inside one of them — and the page is then laid out with that family as its own block, below the first. The view, though, was left exactly wher…","Collapse no longer opens in the middle of itself. Pressing Collapse (or folding with a box's ▾) used to leave the view clamped into whatever part of the old, much larger page you had last scrolled to — on a family of 76 that meant the folded tree opened with its start 119px off the left of the pa…","Fit now really shows everyone. It only ever fitted the width: on a 390px phone panel it left a folded 76-person family 334×2188px (55% of it on the panel) and a whole 68-person family 628px wide on a 390px panel — so pressing it repeatedly never showed the bottom or the far side. It now fits both…","Expand all returns you to the readable view the map opens with, instead of leaving the zoom you were using on a page that has just changed size.","Opening the map is unchanged: a big family still opens at the readable zoom, so on a phone you are looking at part of it until you press Fit, which is what Fit is for."]},{"d":"2026-10-11","t":"The Menu no longer offers to delete everyone","x":["“Delete everything” is gone. The Menu now offers Export PDF, Backup (JSON), Restore from backup and Close, and nothing else. The code behind it is gone as well, so nothing on the page can empty your family any more — not the button, and not a mistap on where it used to be. Removing one person fro…"]},{"d":"2026-10-11","t":"A picture can come from your photos, not only from Files","x":["“Add photo” now offers the phone's own pictures. The app used to open the file browser for every picture choice, so the photo gallery was never on the list. For a page asking for an image it now opens a sheet with Photos (Android 13+ system photo picker) and Gallery (the phone's gallery app on ol…","If a phone has no gallery and no photo picker at all, the choice falls back to the file browser, so Add photo can never end up doing nothing.","A picture that cannot be opened now says so. If the phone hands back a picture the app cannot decode — a HEIC photo on a phone without a decoder, or a gallery that returns a photograph we are not allowed to read — the card used to stay exactly as it was, with no message at all, so it looked as th…"]},{"d":"2026-10-11","t":"Everyone who has a picture shows it, in their own card","x":["A box holding a couple drew only one of the two pictures, and never inside a card. The picture was drawn once per box, for the person the box is read through (the earliest born of the pair), floating at the box's left edge — so a husband's or wife's own picture was simply dropped and no card ever…","A picture no longer eats the room a name was given. A column is now a whole name column (CW: 64px on a phone, 96px on a wider screen) plus the 34px picture and the 6px gap after it whenever that person has one, so no name is narrowed to fit a picture. In a couple where the first person had a pict…","A box grows by the picture's width (40px) for each of its columns when anyone in it has a picture: a couple where both are pictured is 282px wide (with a ▾ button) instead of 194. The page therefore gets wider as pictures are added — with all 23 people pictured it grows from 1050px to 1448px — so…"]},{"d":"2026-10-10","t":"Brothers and sisters are drawn in one run, under their own mother and father","x":["Each family's children now sit in one run on their row. A child who married into another family is drawn at the end of their own brothers and sisters nearest the family they married into, so a family reads as a block: mother and father above, their sons and daughters side by side, and their child…","A mother and father are drawn over their own children, and over the ones the family is read through (children who went on to have children of their own), instead of over a block that belongs to a family which merely married into theirs. In the reported tree Parmjit Singh and Gurjit Kaur were draw…","A row is settled after every column in it is known, so a parent follows the columns its children actually got. S Grandad was a full box-width off his own son; he is now directly above him.","Nothing else moved: same canvas for the 23-person family (1850×812), same box widths and row spacing, no text clipped, and the tree still opens at the same readable zoom.","Families could interleave: two families' children were woven together, so a parent's lines fanned across the whole row and you could not see whose sons and daughters were whose. Measured on the 23-person family, the sideways travel from a mother and father to a child fell from average 249px and w…"]},{"d":"2026-10-10","t":"Each person fills their own cell, so a couple stops looking like a half-empty box","x":["The two people in a couple now fill their box. Before, each person's card hugged its own text and sat at the top of the box: one card came out taller than the other, the names were stranded at the top and the rest of the box was empty — which read as the tree glitching out. Both cards are now exa…","A card is now the same colour as a single person's box (--card, with a 1px outline), instead of a darker tint: on one row a person on their own and a person in a couple now look like the same thing drawn once or twice, rather than two different kinds of box.","The name is centred in its card, so a one-line name sits level with a two-line one beside it.","The marriage bar moved down to the middle of the box (it was 17px below the top, which on the taller card read as a stray dash). It now sits in the middle of the 10px gap between the two cards.","414 consistency checks, 0 failed — every card in every couple is the same height as its partner, fills the box's inside exactly (78px of an 84px box), is flush with the box's top and bottom, carries the same fill as a single person's box, has its name centred, and the marriage bar is centred in t…","78 geometry checks, 0 failed and 0 clipped text — every connector still leaves and arrives on the right person's card, and long names still wrap instead of being cut;","10 pixel checks, 0 failed in dark and light mode — each card is still filled and ringed and the line's last pixel still sits on the target card's top edge;","177 Node assertions, 0 failed (link 28, zoom 24, combine 18, space 23, badlink 28, badload 11, sidefamily 27, anchoring 18), the 4,260-operation sweep introduced no violation, and over 250 random families and 6 set shapes nothing overlaps, no connector runs upward and none crosses a box."]},{"d":"2026-10-10","t":"Each person in a couple sits in their own card, so a line can be seen to touch one of them","x":["A box that holds a couple now draws each person in their own card, joined by a short marriage bar, instead of two names loose in one box. Each card has its own outline and a slightly darker fill, so the pair reads as two separate people at a glance — and the line that arrives at the box can be se…","The connector reaches the card itself, not just the edge of the box: a couple's box reserves only 2px above the cards, so the line ends exactly on the top edge of the person's card.","Everything else is where it was. The card is drawn with outline, which takes up no space, so the canvas, box widths, wrapping, row spacing and every connector position are unchanged (1050×896 for the 23-person family, opening at 78%) and no text is clipped."]},{"d":"2026-10-10","t":"A connector points at the person it belongs to, not at the couple","x":["A parent's line into a box that holds a couple no longer lands between the two names. Every connector used to be drawn from the middle of the parent's box to the middle of the child's box, so a line belonging to one spouse arrived between the pair — and with both names under one line the family a…","A line both parents share still leaves the middle of the pair. When the two people in the box are both the child's parents the two ends average out, so the couple's own line down to their children is unchanged — the change only separates the one-parent case from the two-parent case."]},{"d":"2026-10-10","t":"Brothers and sisters share a row, and a family sits above its children","x":["A brother or sister who married into a family that goes back further no longer leaves the rest of the family a row higher. The married sibling is drawn deep in the other family's line, and the unmarried brothers and sisters used to stay where their own parents left them, so the family looked spli…","A girl's parents are no longer left rows up the page. Even when their own parents are recorded — so they have a fixed generation to sit on — the parents now move down to the row above the couple their child married, one generation at a time, instead of staying where they were with a long line rea…"]},{"d":"2026-10-10","t":"A new branch goes down the page, not up it","x":["A relative who arrives with a family of his own is no longer dragged across into it. Adding a brother with a wife, children and her parents used to shuffle your own family sideways and file everyone into the other family's columns — the brother was hung under her parents instead of his own, and h…","The same holds a generation down: your children's in-laws. When a child marries and the spouse's parents (and their other children) are recorded, the child's couple used to be drawn 374px out under those in-laws and a grandchild 449px away under the great-grandparents' box; now the child's couple…","A family that marries into another is now laid out right beside the couple it joins, inside their parents' span, instead of at the far end of the page — so the two halves of a related family stay together and the connecting lines stay short. Across 40 generated families with marriages at every de…","Each family is laid out as its own block: a box is drawn above its children and centred on them, and each child stays under its parent, so a branch reads straight down the page. A family that joins by marriage is placed next to the one it joins rather than between its rows. (A wife's parents are …","A saved tree whose rows do not start at the top (which a link crossed by mistake could produce) is now drawn instead of throwing the tree away — the layout walks the rows that are actually there."]},{"d":"2026-10-10","t":"A couple sits side by side in the tree","x":["Partners are drawn next to each other instead of one above the other. In a box holding a couple each person now gets their own column, so the two names sit side by side; the box makes room by growing wider rather than taller. A box only grows taller when a single name is too long for its column a…","Each person's column is as wide as the name column of a box holding one person, so no partner is squeezed into half the room. On a phone a couple's box is 194px wide instead of 122, and a single-person box is unchanged at 122.","A box holding a long marriage chain (up to 10 people) now spreads across the width instead of stacking ten lines high, so the tree is shorter as well as wider."]},{"d":"2026-10-10","t":"A link that would break the tree is refused instead","x":["Linking a relative you had already added could save a link that made the family impossible to draw — for instance a son's wife becoming his father's parent, or a great-granddaughter being made a brother or sister. The tree then stopped redrawing, so it looked frozen and went on showing the relati…","A family already saved with such a link is repaired when the app opens — just those links are undone, nothing else is touched, and the app says so.","Names in a crowded box no longer run into each other. A box that holds several people gives each one their own column (and a second line for a long name), so no name is ever drawn over another and a parent is never hidden inside their child's box.","The pickers now only offer people who could really hold the place you tapped: never yourself, never your partner and never someone already in that place, and never anyone straight up or down your own line — so a mis-tap cannot quietly wreck the family."]},{"d":"2026-10-10","t":"The tree opens readable instead of shrunk to a speck","x":["The tree used to open zoomed all the way out so every box fitted, which made the names too small to read once the family grew. It now opens at a readable size (never below 78%) and you drag to the rest — Fit still shows the whole family at once.","Zoomed out, the clutter is hidden. Below 90% zoom the boxes show names only, with the dates and nicknames dropped and the names drawn slightly larger, so the wide view stays legible. Zoom in and the dates come back.","Boxes are a little narrower and taller on a phone (122×84) so more of the family fits per screen."]},{"d":"2026-10-10","t":"Link people you already added","x":["Someone's card now has a Link someone already added section: Pick a parent / partner / child / brother or sister / grandparent / grandchild, then choose the person from a searchable list. No new person is created and nothing is typed twice — the relationship is made between two people you already…","The card and the tree update immediately afterwards.","The old create-new-person chips now sit under a clear Add a new person heading, so it is obvious which row adds someone and which one links someone.","Verified the usual guards still hold when linking: no loops, no self-links, no third parent, no duplicate links — each is refused with a message instead of quietly duplicating."]},{"d":"2026-10-10","t":"Drag the tree, pinch to zoom","x":["The tree is now a pannable, zoomable canvas: drag with one finger to move around, pinch with two fingers to zoom, − / + to zoom a step at a time, and Fit to jump back to the whole family. On a desktop browser the mouse drags and the wheel zooms.","Panning is clamped, so the family can never be thrown off the screen.","The tree is a fixed-height panel you move around inside instead of a page you scroll, so zooming in and sliding sideways both work. A drag no longer opens a person's card by accident — only a tap does."]},{"d":"2026-10-10","t":"Room to breathe in the tree boxes","x":["~~A couple's names no longer sit side by side and touch. Each person in a box now gets their own line inside it, with their dates beside the name, so two names can never collide.~~ Superseded: partners are side by side again (see the entry at the top). The two names still can never collide, becau…","Roomier, more even spacing: column gap 22px (was 16) and row pitch 136px (was 112) on a phone, with 44px between one family block and the next."]},{"d":"2026-10-10","t":"Related families are one tree, plus a ⟳ update button","x":["⟳ in the top right, next to ⋮. Tap it and the app checks for a newer version and applies it straight away. (Until now a downloaded update only took effect on the next launch; launching now says “Update ready – tap ⟳ to apply”.)","Families joined by a marriage are drawn as one tree. Each blood family used to get its own block, so a couple whose two sides were both recorded was drawn twice and their two families sat apart. People are now grouped into couples first, and a couple keeps the parents from both sides — so the who…","A family only stays a separate block when there is genuinely no relationship between them.","Because a combined tree is wider, the Tree still opens fitted to the screen. When it is too wide to read at a glance the hint says so — tap + to zoom in, or Everyone for readable names."]},{"d":"2026-10-10","t":"The tree fits a phone and shows every branch","x":["The tree is a tree again, and the whole family is in it. The Tree was drawn on one canvas about 4.5x wider than a phone screen, so only the first branch was visible and the rest — including relatives who joined by marriage — sat off to the right. Each root family is now laid out on its own and st…","Boxes are sized for a phone on narrow screens (132x66 instead of 176x72), and the Tree auto-fits the remaining width when it opens. A 23-person family now draws at about 80% scale, all at once, with nothing clipped and no overlapping boxes.","Everyone — an indented list of the whole family that never scrolls sideways — is still one tap away beside Map. Fit, − and + zoom the Map, and Expand all / Collapse fold branches in either view."]},{"d":"2026-10-10","t":"The tree always shows everyone","x":["Everyone is visible in the Tree again. The Tree was opening folded, so only the top-level people were drawn and most of the family (brothers, sisters, cousins) looked missing. The Tree now opens fully expanded, so every person in your tree is on screen — including people who are only linked as so…","The ▾ / ▸ toggle now starts at ▾ (open); Collapse folds the whole tree and Expand all opens it again."]},{"d":"2026-10-10","t":"Easier relationships \u0026 a calmer tree","x":["Children in the edit screen. The Add/Edit person screen now has Parents, Partners and Children, so a person's whole immediate family can be set up in one go. Removing a child unlinks it from that person.","Expand all / Collapse buttons on the Tree, plus a per-person ▸ / ▾ toggle that shows how many people are hidden under it.","~~The Tree opens collapsed.~~ Superseded: the Tree now opens expanded so everyone is visible. See the entry above."]},{"d":"2026-10-10","t":"Faster entry, version-safe saves \u0026 a clearer tree","x":["Save \u0026 another button when adding a person, so you can enter several people in a row without reopening the form.","Enter now saves the Add/Edit screen from any field (except Notes), and the Name field is focused automatically.","The Add/Edit screen is tidier — Name / Nickname, then Born / Died, then Notes, with the photo picker moved below — so adding someone takes fewer taps.","The Tree shows both people in a couple with their years.","The People list shows both parents with their years, e.g. Child of Sam 1950– \u0026 Ada 1948–.","Siblings are listed oldest to youngest.","Restoring a backup saved in the older { people, notes } shape now brings the notes back as well.","Backup files carry a version stamp and import tolerantly across versions."]},{"d":"2026-10-10","t":"Nicknames \u0026 a real tree","x":["Nicknames, shown beside the name everywhere and included in search and backups. A note like John \"Jack\" Smith is split into name + nickname.","Brother / Sister when adding a relative, plus siblings, grandparent and grandchild on the Connect people screen — so more than just parent/partner/child.","A real tree. The Tree tab draws a branching diagram — a box for each person (with photo and nickname) joined by connector lines — that scrolls and zooms."]},{"d":"2026-10-10","t":"Photos \u0026 richer relationships","x":["A photo for each person (shrunk on the device), shown on the person view and in the People list.","Edit any time — a ✎ button on every People-list row.","More relatives shown — Parents, Partners, Children, Siblings, Grandparents, Grandchildren, Aunts \u0026 Uncles, Nieces \u0026 Nephews and Cousins."]},{"d":"2026-10-10","t":"US date format","x":["Dates can be entered as MM/DD/YYYY (for example 01/13/1985) alongside YYYY, YYYY-MM and YYYY-MM-DD."]}]</script>
<script>
const $=s=>document.querySelector(s),KEY='familytree.v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
// The version of this page. Settings shows it and What's New compares against it; the notes for every
// release the app has ever had are in the JSON block above, tagged id="upd".
const VER='1.0.1',UPD=(()=>{try{return JSON.parse(document.getElementById('upd').textContent)||[]}catch(e){return[]}})();
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=[],M=new Map,C=new Map,tab='people',qs='',selA=null,selB=null,conn=false,onYes=null,N=[],sc=null,tx=null,ty=null,col=new Set(),gW=0,gH=0,firstMap=1,tv='map',fitAll=0,anchorId=null,anchorFirst=0;
const str=x=>String(x??''),arr=x=>Array.isArray(x)?x:[];
// A person carries the two links a family is made of — a parent and a partner — plus, when it is known,
// the brothers and sisters nobody can point at a parent for yet (see sibPair below).
const normPerson=x=>{const o=x&&typeof x=='object'?x:{},sibs=[...new Set(arr(o.sibs).map(str).filter(Boolean))];return{id:str(o.id)||uid(),name:str(o.name)||str(o.nick),nick:str(o.name)?str(o.nick):'',birth:str(o.birth),death:str(o.death),note:str(o.note),photo:str(o.photo),parents:arr(o.parents).map(str),partners:arr(o.partners).map(str),...(sibs.length?{sibs}:{})}};
function loadData(){let pl=[],nt=[];try{const d=JSON.parse(localStorage.getItem(KEY)||'null');pl=Array.isArray(d)?d:arr(d&&d.people);nt=arr(d&&d.notes)}catch(e){}try{const n=JSON.parse(localStorage.getItem(KEY+'.notes')||'null');if(Array.isArray(n))nt=n}catch(e){}return{people:pl.filter(x=>x&&x.id).map(normPerson),notes:nt.filter(x=>x&&x.t).map(x=>({id:str(x.id)||uid(),t:str(x.t)}))}}
{const d=loadData();P=d.people;N=d.notes}
// Month names, so a date can be written the way people write it. One list feeds the reader, the
// writer and the notes, so nothing can drift apart.
const MON='january february march april may june july august september october november december'.split(' '),
 MONRE='(?:'+MON.map(m=>m.slice(0,3)).join('|')+')[a-z]*[.]?',
 monNum=t=>{t=String(t||'').toLowerCase().replace(/[.]$/,'');if(t.length<3)return 0;const i=MON.findIndex(m=>m.slice(0,3)==t.slice(0,3));return i<0?0:i+1};
const yr=d=>/^[0-9]{4}/.test(String(d||''))?String(d).slice(0,4):'';
// A date nobody gave a year for is kept as "--07-04" (the 4th of July, year unknown) and shown as a
// day and month; every date with a year keeps it.
const pd=d=>{const m=/^--([0-9]{2})(?:-([0-9]{2}))?$/.exec(String(d||''));if(!m)return'';
 const mo=+m[1],dd=+m[2];
 return dd?new Date(2000,mo-1,dd).toLocaleDateString(undefined,{day:'numeric',month:'short'}):new Date(2000,mo-1,1).toLocaleDateString(undefined,{month:'short'})};
// A year range whenever a year is known, and a bare day and month when none ever was
const life=p=>{const b=yr(p.birth)||pd(p.birth),d=yr(p.death)||pd(p.death);if(!b&&!d)return'';
 return p.death?(b||'')+'–'+d:b+'–'};
const sk=p=>(yr(p.birth)||'9999')+p.name,cmp=(a,b)=>sk(a)<sk(b)?-1:1;
const fmt=d=>{const m=/^([0-9]{4})(?:-([0-9]{2})(?:-([0-9]{2}))?)?$/.exec(String(d||''));
 if(!m)return pd(d)||String(d||'');
 const y=+m[1],mo=+m[2],dd=+m[3];if(!mo)return String(y);
 return new Date(y,mo-1,dd||1).toLocaleDateString(undefined,{year:'numeric',month:'short',day:dd?'numeric':undefined})};
const age=p=>{const b=parseInt(yr(p.birth)||'0');if(!b)return'';const dy=parseInt(yr(p.death)||'0');if(p.death&&!dy)return'';
 const n=(dy||new Date().getFullYear())-b;return n>=0?(p.death?'Lived ':'Age ')+n:''};
const pad2=n=>String(n).padStart(2,'0');
// One reader for the Born and Died boxes and for notes, forgiving on purpose: the year can be left
// out ("7/4" is the 4th of July), a month can be written out ("4 Jul", "July 4", "July 1950"), and
// "21/7" is read as 21 July because a first number over 12 can only be a day. A date with no year is
// kept as "--MM-DD", so nothing ever has to guess which year it was.
const normDate=v=>{v=String(v??'').trim();if(!v)return'';let m,mo,d,y=null;
 if(m=v.match(/^([0-9]{4})$/))return m[1];
 else if(m=v.match(/^--([0-9]{1,2})(?:-([0-9]{1,2}))?$/)){mo=+m[1];d=m[2]?+m[2]:null}
 else if(m=v.match(/^([0-9]{4})[-/.]([0-9]{1,2})(?:[-/.]([0-9]{1,2}))?$/)){y=+m[1];mo=+m[2];d=m[3]?+m[3]:null}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{1,2})[-/.]([0-9]{4})$/)){y=+m[3];const a=+m[1],b=+m[2];if(a>12&&b<=12){d=a;mo=b}else{mo=a;d=b}}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{1,2})$/)){const a=+m[1],b=+m[2];if(a>12&&b<=12){d=a;mo=b}else{mo=a;d=b}}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{4})$/)){mo=+m[1];y=+m[2];d=null}
 else if(m=v.match(new RegExp('^([0-9]{1,2})(?:st|nd|rd|th)?[, ]+('+MONRE+')(?:[, ]+([0-9]{4}))?$','i'))){d=+m[1];mo=monNum(m[2]);y=m[3]?+m[3]:null}
 else if(m=v.match(new RegExp('^('+MONRE+')[, ]+([0-9]{1,2})(?:st|nd|rd|th)?(?:[, ]+([0-9]{4}))?$','i'))){mo=monNum(m[1]);d=+m[2];y=m[3]?+m[3]:null}
 else if(m=v.match(new RegExp('^('+MONRE+')[, ]+([0-9]{4})$','i'))){mo=monNum(m[1]);y=+m[2];d=null}
 else if(m=v.match(new RegExp('^('+MONRE+')$','i'))){mo=monNum(m[1]);d=null}
 else return null;
 if(!mo||mo<1||mo>12||(d!=null&&(d<1||d>31)))return null;
 return y==null?'--'+pad2(mo)+(d!=null?'-'+pad2(d):''):String(y)+'-'+pad2(mo)+(d!=null?'-'+pad2(d):'')};
const shrink=(f,cb,no)=>{const fail=()=>no&&no();const r=new FileReader();r.onerror=fail;r.onload=()=>{const i=new Image();i.onerror=fail;i.onload=()=>{const s=240,m=Math.min(s/i.width,s/i.height,1),cv=document.createElement('canvas');cv.width=Math.round(i.width*m)||s;cv.height=Math.round(i.height*m)||s;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)};
const ava=p=>p.photo?`<img class="av" src="${p.photo}" alt="">`:'';
// A message about something done in a dialog has to be readable: a toast left in the page is painted
// behind an open dialog, so while one is open the toast lives inside it, and a dialog that redraws
// itself hands the toast back to the page rather than throwing the message away.
const say=m=>{const o=document.querySelector('dialog[open]');let t=$('#tt');
 if(!t){t=document.createElement('div');t.id='tt'}
 t.textContent=m;t.className='on';(o||document.body).append(t);setTimeout(()=>t.className='',2200)};
// ---- birthdays: everyone alive whose born date has a day and month. Only the day and month of each
// living person is ever handed to the phone, so a birthday comes round again on its own every year and
// nothing has to be sent again. The app on the phone wakes once a day and puts a quiet notification on
// the screen for whoever's birthday it is; when the app on the phone is older than this page, the
// feature says so instead of pretending to work.
const bdOf=p=>{const m=/^(?:([0-9]{4})-|--)([0-9]{2})-([0-9]{2})$/.exec(str(p.birth));if(!m)return null;
 const mo=+m[2],d=+m[3];return mo>=1&&mo<=12&&d>=1&&d<=31?{mo,d,y:m[1]?+m[1]:0}:null};
const bdList=()=>P.filter(p=>!str(p.death)).map(p=>({p,b:bdOf(p)})).filter(x=>x.b);
const bdOn=()=>{try{return localStorage.getItem(KEY+'.bdays')=='1'}catch(e){return false}};
const bdSet=on=>{try{localStorage.setItem(KEY+'.bdays',on?'1':'0')}catch(e){}};
// 'native' when this phone's app can do it, 'old' when the app is older than this page, 'web' in a browser
const bdCap=()=>{try{const A=window.Android;if(!A)return 'web';return typeof A.bdays=='function'?'native':'old'}catch(e){return 'web'}};
const bdNext=()=>{const now=new Date();now.setHours(0,0,0,0);const y=now.getFullYear();
 return bdList().map(x=>{let t=new Date(y,x.b.mo-1,x.b.d);if(t.getTime()<now.getTime())t=new Date(y+1,x.b.mo-1,x.b.d);
  return{x:x.b,p:x.p,d:Math.round((t-now)/864e5),when:t}}).sort((a,b)=>a.d-b.d)};
const bdPush=()=>{if(bdCap()!='native')return;try{window.Android.bdays(bdOn(),JSON.stringify(bdList().map(x=>({n:x.p.name,m:x.b.mo,d:x.b.d,y:x.b.y}))))}catch(e){}};
const bdWhen=d=>d==0?'today':d==1?'tomorrow':'in '+d+' days';
const bdTurns=x=>x.x.y&&x.x.y<=x.when.getFullYear()?' · turns '+(x.when.getFullYear()-x.x.y):'';
function bdaysView(){const L=bdNext();
 show(`<h2>Birthdays</h2><p class="m">Everyone here who is alive and whose born date has a day and month.</p>`+
