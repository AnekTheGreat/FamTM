<script>
const $=s=>document.querySelector(s),KEY='familytree.v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);

{const d=loadData();P=d.people;N=d.notes}
// Month names, so a date can be written the way people write it. One list feeds the reader, the
// writer and the notes, so nothing can drift apart.
const MON='january february march april may june july august september october november december'.split(' '),
 MONRE='(?:'+MON.map(m=>m.slice(0,3)).join('|')+')[a-z]*[.]?',

const yr=d=>/^[0-9]{4}/.test(String(d||''))?String(d).slice(0,4):'';
// A date nobody gave a year for is kept as "--07-04" (the 4th of July, year unknown) and shown as a
// day and month; every date with a year keeps it.
const pd=d=>{const m=/^--([0-9]{2})(?:-([0-9]{2}))?$/.exec(String(d||''));if(!m)return'';
 const mo=+m[1],dd=+m[2];
 return dd?new Date(2000,mo-1,dd).toLocaleDateString(undefined,{day:'numeric',month:'short'}):new Date(2000,mo-1,1).toLocaleDateString(undefined,{month:'short'})};
// A year range whenever a year is known, and a bare day and month when none ever was
const life=p=>{const b=yr(p.birth)||pd(p.birth),d=yr(p.death)||pd(p.death);if(!b&&!d)return'';
 return p.death?(b||'')+'–'+d:b+'–'};
const sk=p=>(yr(p.birth)||'9999')+p.name,cmp=(a,b)=>sk(a)<sk(b)?-1:1;
const fmt=d=>{const m=/^([0-9]{4})(?:-([0-9]{2})(?:-([0-9]{2}))?)?$/.exec(String(d||''));
 if(!m)return pd(d)||String(d||'');
 const y=+m[1],mo=+m[2],dd=+m[3];if(!mo)return String(y);
 return new Date(y,mo-1,dd||1).toLocaleDateString(undefined,{year:'numeric',month:'short',day:dd?'numeric':undefined})};
const age=p=>{const b=parseInt(yr(p.birth)||'0');if(!b)return'';const dy=parseInt(yr(p.death)||'0');if(p.death&&!dy)return'';
 const n=(dy||new Date().getFullYear())-b;return n>=0?(p.death?'Lived ':'Age ')+n:''};
const pad2=n=>String(n).padStart(2,'0');
// One reader for the Born and Died boxes and for notes, forgiving on purpose: the year can be left
// out ("7/4" is the 4th of July), a month can be written out ("4 Jul", "July 4", "July 1950"), and
// "21/7" is read as 21 July because a first number over 12 can only be a day. A date with no year is
// kept as "--MM-DD", so nothing ever has to guess which year it was.
const normDate=v=>{v=String(v??'').trim();if(!v)return'';let m,mo,d,y=null;
 if(m=v.match(/^([0-9]{4})$/))return m[1];
 else if(m=v.match(/^--([0-9]{1,2})(?:-([0-9]{1,2}))?$/)){mo=+m[1];d=m[2]?+m[2]:null}
 else if(m=v.match(/^([0-9]{4})[-/.]([0-9]{1,2})(?:[-/.]([0-9]{1,2}))?$/)){y=+m[1];mo=+m[2];d=m[3]?+m[3]:null}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{1,2})[-/.]([0-9]{4})$/)){y=+m[3];const a=+m[1],b=+m[2];if(a>12&&b<=12){d=a;mo=b}else{mo=a;d=b}}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{1,2})$/)){const a=+m[1],b=+m[2];if(a>12&&b<=12){d=a;mo=b}else{mo=a;d=b}}
 else if(m=v.match(/^([0-9]{1,2})[-/.]([0-9]{4})$/)){mo=+m[1];y=+m[2];d=null}
 else if(m=v.match(new RegExp('^([0-9]{1,2})(?:st|nd|rd|th)?[, ]+('+MONRE+')(?:[, ]+([0-9]{4}))?$','i'))){d=+m[1];mo=monNum(m[2]);y=m[3]?+m[3]:null}
 else if(m=v.match(new RegExp('^('+MONRE+')[, ]+([0-9]{1,2})(?:st|nd|rd|th)?(?:[, ]+([0-9]{4}))?$','i'))){mo=monNum(m[1]);d=+m[2];y=m[3]?+m[3]:null}
 else if(m=v.match(new RegExp('^('+MONRE+')[, ]+([0-9]{4})$','i'))){mo=monNum(m[1]);y=+m[2];d=null}
 else if(m=v.match(new RegExp('^('+MONRE+')$','i'))){mo=monNum(m[1]);d=null}
 else return null;
 if(!mo||mo<1||mo>12||(d!=null&&(d<1||d>31)))return null;
 return y==null?'--'+pad2(mo)+(d!=null?'-'+pad2(d):''):String(y)+'-'+pad2(mo)+(d!=null?'-'+pad2(d):'')};
const shrink=(f,cb,no)=>{const fail=()=>no&&no();const r=new FileReader();r.onerror=fail;r.onload=()=>{const i=new Image();i.onerror=fail;i.onload=()=>{const s=240,m=Math.min(s/i.width,s/i.height,1),cv=document.createElement('canvas');cv.width=Math.round(i.width*m)||s;cv.height=Math.round(i.height*m)||s;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)};
const ava=p=>p.photo?`<img class="av" src="${p.photo}" alt="">`:'';
const say=m=>{const t=$('#tt');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)};
function index(){M=new Map(P.map(p=>[p.id,p]));C=new Map;for(const p of P)for(const i of p.parents){if(!C.has(i))C.set(i,[]);C.get(i).push(p)}for(const a of C.values())a.sort(cmp)}
function commit(){try{localStorage.setItem(KEY,JSON.stringify(P));localStorage.setItem(KEY+'.notes',JSON.stringify(N))}catch(e){say(e&&e.name=='QuotaExceededError'?'Storage full – remove some photos or back up first':'Could not save – storage blocked')}index();render()}
const desc=id=>{const s=new Set,st=[id];while(st.length)for(const c of C.get(st.pop())||[])if(!s.has(c.id)){s.add(c.id);st.push(c.id)}return s};
const ancIds=id=>{const s=new Set,st=[...parIds(id)];while(st.length){const c=st.pop();if(s.has(c))continue;s.add(c);(M.get(c)&&M.get(c).parents||[]).forEach(q=>st.push(q))}return s};
// Why a family can't be drawn: someone is their own ancestor, a partner is also a parent/child,
// or two marriage-joined families point at each other in a loop. Keys are stable, so a link can
// be checked by asking which problems it ADDS rather than which exist.
function famIssues(){const out=[];
 for(const p of P){
  if(p.parents.includes(p.id)||p.partners.includes(p.id))out.push('self:'+p.id);
  if(new Set(p.parents).size!==p.parents.length)out.push('dup:'+p.id);
  if(p.parents.length>2)out.push('many:'+p.id);
  for(const q of p.parents){if(M.has(q)&&ancIds(q).has(p.id))out.push('loop:'+p.id)}
  for(const q of p.partners)if(ancIds(p.id).has(q)||ancIds(q).has(p.id))out.push('mixed:'+p.id)}
 const uf=new Map();P.forEach(p=>uf.set(p.id,p.id));
 const find=a=>{let r=a;while(uf.get(r)!==r)r=uf.get(r);while(uf.get(a)!==r){const n=uf.get(a);uf.set(a,r);a=n}return r};
 P.forEach(p=>p.partners.forEach(q=>{if(M.has(q)){const x=find(p.id),y=find(q);if(x!==y)uf.set(y,x)}}));
 const out2=new Map(),deg=new Map(),units=new Set();P.forEach(p=>units.add(find(p.id)));
 P.forEach(p=>{const rp=find(p.id);p.parents.forEach(q=>{if(!M.has(q))return;const rq=find(q);if(rq===rp)return;
  if(!out2.has(rq))out2.set(rq,new Set());if(!out2.get(rq).has(rp)){out2.get(rq).add(rp);deg.set(rp,(deg.get(rp)||0)+1)}})});
 const q=[...units].filter(u=>!deg.get(u));let n=0;
 while(q.length){const u=q.pop();n++;(out2.get(u)||new Set()).forEach(v=>{deg.set(v,deg.get(v)-1);if(!deg.get(v))q.push(v)})}
 if(n<units.size)out.push('knot:'+n);
 P.forEach(p=>p.parents.forEach(q2=>{if(M.has(q2)&&find(p.id)===find(q2))out.push('same:'+p.id)}));   // parent and child in one box

const ISSUE={self:'That would link someone to themselves',dup:'Those two are already linked there',many:'already has two parents',

 mixed:'are already related through each other’s line, so that would loop the family back on itself',
 knot:'are already joined by a marriage, so that would tie the two sides in a loop'};
// A link saved before this check existed can leave the family impossible to draw. Undo just
// those links on launch, newest first, and say so rather than silently leaving a broken tree.
function repair(){let fixed=0;const drop=[];
 P.forEach(p=>p.parents.forEach(q=>{if(q===p.id||ancIds(q).has(p.id))drop.push([p,q])}));
 drop.forEach(([p,q])=>{p.parents=p.parents.filter(x=>x!==q);fixed++});index();
 for(let g=0;g<P.length&&famIssues().some(k=>k.startsWith('knot:'));g++){let done=0;
  for(let i=P.length-1;i>=0&&!done;i--)for(let j=P[i].parents.length-1;j>=0&&!done;j--){
   const p=P[i],q=p.parents.splice(j,1)[0];index();
   if(famIssues().some(k=>k.startsWith('knot:'))){p.parents.splice(j,0,q);index()}else{fixed++;done=1}}}
 if(fixed){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}return fixed}
const issueMsg=(k,a,b)=>{const[t,id]=k.split(':');
 return t=='many'?(M.get(id)?.name||'They')+' already has two parents':
  t=='self'||t=='dup'?ISSUE[t]:t=='same'?'That would drop '+((M.get(id)?.name)||'someone')+' into the same box as their own parent – nothing was changed':
  ((a&&a.name)||'They')+' and '+((b&&b.name)||'they')+' '+ISSUE[t]+' – nothing was changed'};
const uniq=a=>[...new Set(a)],parIds=id=>(M.get(id)?.parents||[]),kidIds=id=>(C.get(id)||[]).map(x=>x.id);
const byBirthId=(a,b)=>{const A=M.get(a),B=M.get(b);return A&&B?cmp(A,B):0};
const sibIds=id=>uniq(parIds(id).flatMap(i=>kidIds(i))).filter(x=>x!==id).sort(byBirthId);
const gpIds=id=>uniq(parIds(id).flatMap(i=>parIds(i)));
const gcIds=id=>uniq(kidIds(id).flatMap(i=>kidIds(i)));
const uncIds=id=>uniq(parIds(id).flatMap(i=>sibIds(i))).filter(x=>x!==id&&!parIds(id).includes(x));
const nieIds=id=>uniq(sibIds(id).flatMap(i=>kidIds(i)));
const couIds=id=>uniq(uncIds(id).flatMap(i=>kidIds(i))).filter(x=>x!==id&&!nieIds(id).includes(x)&&!sibIds(id).includes(x));
const sibLink=(a,b)=>{if(a.parents.some(p=>b.parents.includes(p)))return '';const tryAdd=(s,d)=>{const p=s.parents.find(x=>d.parents.length<2&&!d.parents.includes(x)&&!desc(d.id).has(x)&&x!==d.id);return p?(d.parents.push(p),true):false};if(a.parents.length&&tryAdd(a,b))return '';if(b.parents.length&&tryAdd(b,a))return '';if(a.parents.length<2&&b.parents.length<2){const nid=uid(),u={id:nid,name:'Unknown',nick:'',birth:'',death:'',note:'',parents:[],partners:[]};P.push(u);a.parents.push(nid);b.parents.push(nid);return ''}return 'No room to add a shared parent'};
function build(){
 const uf=new Map(),find=a=>{let r=a;while(uf.get(r)!==r)r=uf.get(r);while(uf.get(a)!==r){const n=uf.get(a);uf.set(a,r);a=n}return r};
 P.forEach(p=>uf.set(p.id,p.id));
 P.forEach(p=>p.partners.forEach(q=>{if(M.has(q)){const a=find(p.id),b=find(q);if(a!==b)uf.set(b,a)}}));
 const U=new Map();
 P.forEach(p=>{const r=find(p.id);if(!U.has(r))U.set(r,{mem:[],cp:new Set(),ck:new Set()});U.get(r).mem.push(p.id)});
 P.forEach(p=>{const rp=find(p.id);p.parents.forEach(q=>{if(!M.has(q))return;const rq=find(q);if(rq!==rp){U.get(rq).ck.add(rp);U.get(rp).cp.add(rq)}})});

 U.forEach((u,r)=>{const mem=u.mem.map(i=>M.get(i)).sort(cmp);nodes.push({r,mem,p:mem[0],ps:mem.slice(1),pr:[...u.cp],ck:[...u.ck],kids:[],x:null,d:0})});

 nodes.forEach(n=>n.kids=n.ck.map(r=>N.get(r)).filter(Boolean));
 const dep=(n,path)=>{if(n.fx)return n.d;if(path.has(n.r))return 0;path.add(n.r);let d=0;n.pr.forEach(r=>{const q=N.get(r);if(q)d=Math.max(d,dep(q,path)+1)});path.delete(n.r);n.d=d;n.fx=1;return d};
 nodes.forEach(n=>dep(n,new Set()));
 // A family is drawn on the row just above its own children whenever there is room, so a family
 // pulled deep by a marriage is not abandoned rows up the page, and brothers and sisters share one
 // row, so a sibling who married into a family that goes back further does not leave the rest of

const clampView=vp=>{const w=vp.clientWidth,h=vp.clientHeight,cw=gW*sc,ch=gH*sc;
