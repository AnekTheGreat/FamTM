name: Build APK + AAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # AGP 8.10.1 will not run on anything older than 8.11.1, and the repository carries no wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # No key material is in the repository: the keystore arrives from the KEYSTORE_BASE64 secret
      # and lives only for the length of this job.
      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/famtm.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/famtm.p12" >> "$GITHUB_ENV"

      # A versionCode that rises on every build, from the clock in UTC: 26110421 for the 9pm build of
      # 4 Nov 2026. The run number cannot do this job - GitHub counts each workflow's runs separately (this
      # file is at 43, release.yml at 3) - and a build whose code is lower than the one already on the phone
      # is refused as a downgrade, however new its contents are.
      - name: Resolve the build version
        run: |
          echo "VERSION_NAME=1.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(date -u +%y%m%d%H)" >> "$GITHUB_ENV"

      # Both formats, both build types: assemble* = APK, bundle* = AAB.
      - name: Build the APKs and AABs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: famtm
        run: |
          gradle assembleDebug assembleRelease bundleDebug bundleRelease \
            --no-daemon

      # Play refuses an upload that targets less than API 36, and the number in the build file is only
      # a claim until the built package is read back - so the APK itself is asked.
      - name: Check the APK targets API 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          "$SDK/build-tools/$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion)" "$RUNNER_TEMP/badging.txt"
          if ! grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::the built APK does not target API 36 - Play will refuse it"
            exit 1
          fi

      - name: Check the release APK is signed and both AABs exist
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          DAAB=app/build/outputs/bundle/debug/app-debug.aab
          if [ ! -f "$APK" ]; then
            echo "::error::the release APK is unsigned - the signing secrets did not reach the build"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          for f in "$AAB" "$DAAB"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced - bundleDebug/bundleRelease did not run"
              ls -l app/build/outputs/bundle/ || true
              exit 1
            fi
          done
          echo "signed and packaged: $APK ($(du -h "$APK" | cut -f1)), $AAB ($(du -h "$AAB" | cut -f1))"

      # Flat, versioned names in one folder, the shape SideCut's releases have.
      - name: Name the outputs
        run: |
          V="1.4.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk        "dist/FamTM-$V-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk    "dist/FamTM-$V.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab     "dist/FamTM-$V-debug.aab"
          cp app/build/outputs/bundle/release/app-release.aab "dist/FamTM-$V.aab"
          echo '--- dist ---'
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: family-tree-apk-aab
          path: dist/*
          if-no-files-found: error
