name: Apply ship patch

# One-shot: applies dev/ship.patch, commits it and pushes. Deleted once it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply, commit and push
        run: |
          set -e
          git config user.name "AnekTheGreat"
          git config user.email "166177289+AnekTheGreat@users.noreply.github.com"
          # git apply counts every line of a hunk, and a blank line after the last one is counted
          # too - so the file is trimmed to end on its final added line before it is applied.
          python3 -c 'p="dev/ship.patch"; s=open(p,encoding="utf-8").read().rstrip("\n")+"\n"; open(p,"w",encoding="utf-8").write(s)'
          git apply --unidiff-zero --recount --whitespace=nowarn dev/ship.patch
          rm -f dev/ship.patch
          git add -A
          git commit -m "FamTM 1.5.0: hand the birthdays to UJournal through a read-only provider"
          git push origin HEAD:main
