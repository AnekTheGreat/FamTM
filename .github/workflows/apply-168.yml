name: Apply 1.6.8

# One-shot: applies dev/patch-168.py, proves it is idempotent and that My Hub is off the Other apps
# list, and commits it. Page only - no APK, so this ships over the air.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-168
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch, twice
        run: |
          python3 dev/patch-168.py
          A="$(git diff | sha1sum)"
          python3 dev/patch-168.py
          B="$(git diff | sha1sum)"
          if [ "$A" != "$B" ]; then echo "::error::a second run changed something"; exit 1; fi
          echo "idempotent: the same diff after a second run"
          python3 dev/patch-168.py --check

      - name: Check what it wrote
        run: |
          python3 - <<'PY'
          import json, re, sys
          page = open('app/src/main/assets/index.html', encoding='utf-8').read()
          notes = open('PATCH_NOTES.md', encoding='utf-8').read()
          probes = [
              ("const VER='1.6.8'", 'the page does not say 1.6.8'),
              ('"v":"1.6.8"', "What's New has no 1.6.8 entry"),
              ("['Other apps','UJournal, SideCut and MeasureT.']", 'the Guide still names My Hub'),
              ('const APPS=[', 'there is no list of apps'),
          ]
          for probe, why in probes:
              if probe not in page:
                  sys.exit(why)
          if '## 2026-11-06 — v1.6.8' not in notes:
              sys.exit('PATCH_NOTES has no 1.6.8 entry')
          if 'My-Hub' in page:
              sys.exit('My Hub is still linked from the page')
          apps = page[page.index('const APPS=['):]
          apps = apps[:apps.index('];')]
          if apps.count("['") != 4:
              sys.exit('the list has ' + str(apps.count("['")) + ' rows, not 4')
          if 'My Hub' in apps:
              sys.exit('My Hub is still one of the rows')
          block = re.search(r'<script id="upd" type="application/json">(.*?)</script>', page, re.S)
          entries = json.loads(block.group(1))
          if entries[0]['v'] != '1.6.8':
              sys.exit('the newest note is ' + str(entries[0]['v']))
          print('1.6.8: three store pages and this app, no My Hub, changelog parses (' + str(len(entries)) + ' entries)')
          PY
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?![^>]*\bsrc=)(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/g)];
          for (const b of blocks) new Function(b[1]);
          console.log('page: ' + blocks.length + ' script block(s) parse');
          JS

      - name: Commit and push
        run: |
          git config user.name "AnekTheGreat"
          git config user.email "anekthegreat@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already applied - nothing to commit"
            exit 0
          fi
          git commit -m "FamTM 1.6.8: My Hub is off the Other apps list"
          git push
