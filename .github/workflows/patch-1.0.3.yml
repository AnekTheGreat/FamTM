name: Apply the 1.0.3 picture patch

# One-off. The page is a single 123 KB line, and a change to it cannot be sent through the
# GitHub API, so this applies the same edits that were made and checked in the workspace and
# commits them. Delete this file and dev/patch-1.0.3.py once it has run.

on:
  push:
    paths:
      - dev/patch-1.0.3.py
      - .github/workflows/patch-1.0.3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: python3 dev/patch-1.0.3.py

      - name: Commit it
        run: |
          git config user.name "AnekTheGreat"
          git config user.email "166177289+AnekTheGreat@users.noreply.github.com"
          git add -A
          git commit -m "Read the picture in the app, so a HEIC photo is a photo like any other" -m "The page runs in a WebView, and no WebView has a HEIF decoder, so an iPhone's or a modern Android's photo could only ever be refused. The app now decodes what the picker returns itself and hands the page a JPEG it can always open; Files stops hiding a picture whose type it does not know, and the Edit form's Add photo names its own target so a picture handed back by the app lands there." -m "Page v1.0.3, APK 1.3 (versionCode 4)."
          git push
