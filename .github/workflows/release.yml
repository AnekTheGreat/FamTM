name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.4.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Signed APK and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/famtm.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/famtm.p12" >> "$GITHUB_ENV"

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then echo "no version resolved"; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      - name: Build the signed release APK
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: famtm
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced - check the keystore secrets"
            exit 1
          fi
          cp "$APK" "FamTM-${{ steps.v.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: FamTM ${{ steps.v.outputs.name }}
          files: FamTM-*.apk
          generate_release_notes: true
