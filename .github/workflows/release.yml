name: Release APK + AAB

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.5.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Signed APK, AAB and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/famtm.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/famtm.p12" >> "$GITHUB_ENV"

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then echo "no version resolved"; exit 1; fi
          # The version code is the clock, in UTC, to the hour: 26110421 for the 9pm build of 4 Nov 2026.
          # It has to be higher than the code already on the phone, and a run number cannot promise that -
          # GitHub numbers each workflow's runs separately, so this file was at run 2 while main.yml was at
          # 43. A release built from run 3 would have carried versionCode 3, lower than the 5 every APK from
          # main.yml carries, and Android refuses a lower one as a downgrade.
          C="$(date -u +%y%m%d%H)"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "releasing $V (versionCode $C)"

      # A release publishes both formats: the APK for a phone, the AAB for Play Console.
      - name: Build the signed release APK and AAB
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: famtm
        run: gradle assembleRelease bundleRelease --no-daemon

      # The APK itself is asked, so the package and version on the release are the ones really inside it
      # and not what the build file claimed.
      - name: Check the APK's package, version and target
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          "$SDK/build-tools/$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion)" "$RUNNER_TEMP/badging.txt"
          if ! grep -q "package: name='com.FamTM.app'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::the APK is not com.FamTM.app - the id this build used is not the one in app/build.gradle.kts"
            exit 1
          fi
          if ! grep -q "versionCode='${{ steps.v.outputs.code }}'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::the APK does not carry versionCode ${{ steps.v.outputs.code }} - a phone would refuse it as a downgrade"
            exit 1
          fi

      - name: Name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          STATUS=0
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced - check the keystore secrets"
            STATUS=1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::no AAB was produced by bundleRelease"
            STATUS=1
          fi
          [ "$STATUS" -eq 0 ] || exit 1
          cp "$APK" "FamTM-${{ steps.v.outputs.name }}.apk"
          cp "$AAB" "FamTM-${{ steps.v.outputs.name }}.aab"
          ls -l FamTM-*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: FamTM ${{ steps.v.outputs.name }}
          files: |
            FamTM-${{ steps.v.outputs.name }}.apk
            FamTM-${{ steps.v.outputs.name }}.aab
          generate_release_notes: true
