name: Apply the FamTM backup change

# One-off: the FamTM page is one 120 KB file, too large to write through the API by hand, so this job
# applies the anchored patch, checks that the page's script still parses, commits the page and deletes
# this tooling in that same commit — after which there is nothing left here to run.
on:
  push:
    paths: ['tools/famtm-backup-patch.js']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: node tools/famtm-backup-patch.js

      - name: Check the page's script still parses
        run: |
          node -e 'const fs=require("fs");const p=fs.readFileSync("app/src/main/assets/index.html","utf8");const m=/<script>\n([\s\S]*?)\n<\/script><\/body><\/html>/.exec(p);if(!m)throw new Error("the page has no main script");fs.writeFileSync("/tmp/page.js",m[1]);'
          node --check /tmp/page.js

      - name: Commit the page and remove the tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q tools/famtm-backup-patch.js .github/workflows/famtm-backup-patch.yml
          git add app/src/main/assets/index.html
          git commit -m "Export and import everything in FamTM's backup"
          git push
